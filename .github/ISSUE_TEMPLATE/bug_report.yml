name: Bug report
description: Report a reproducible problem.
title: "fix: "
labels: [bug, "status:needs-review"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I understand this issue needs status:approved before a PR can be opened.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a numbered sequence that reliably reproduces the bug.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant errors.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux (Debian/Ubuntu)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent-client
    attributes:
      label: Agent / client
      options:
        - Claude Code
        - OpenCode
        - Gemini CLI
        - Cursor
        - Windsurf
        - Codex
        - Other
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [bash, zsh, fish, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and paste relevant output.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, workarounds, or other useful details.
