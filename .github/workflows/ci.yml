name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-and-database:
    name: Shell and database checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck=0.9.0-1

      - name: Validate shell scripts
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' -not -path './.git/*' -print0
          )
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found; shell validation skipped."
            exit 0
          fi
          printf 'Validating %d shell script(s).\n' "${#scripts[@]}"
          shellcheck -- "${scripts[@]}"
          bash -n -- "${scripts[@]}"

      - name: Run database static smoke checks
        shell: bash
        run: |
          if [[ ! -f scripts/db-smoke.sh ]]; then
            echo "scripts/db-smoke.sh not found; database smoke checks skipped."
            exit 0
          fi
          bash scripts/db-smoke.sh
