# Local Supabase stack configuration. This file plus `supabase/migrations/` is
# the only source of truth for the database; schema changes ship as reviewed
# migrations, never as dashboard edits. Only non-default values are set here.
project_id = "control-base"

[api]
enabled = true
port = 54321
schemas = ["public"]
# Require explicit GRANTs so new objects are never exposed by default.
auto_expose_new_tables = false

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Seeding stays disabled until a reviewed seed file exists.
enabled = false

[studio]
enabled = true
port = 54323

# Local email capture used to inspect invitation mails during development.
[local_smtp]
enabled = true
port = 54324

# Invitation mail boundary. JWT verification stays on: the function forwards the caller's
# token to the database, which is what decides whether they own the team.
[functions.send-invitation]
verify_jwt = true

[storage]
enabled = false

[realtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
